server:
  port: ${PORT:10000}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:

logging:
  level:
    com.zaxxer.hikari: DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000      # ⭐ Access Token 15 分鐘
  refresh-expiration: 604800000  # ⭐ Refresh Token 7 天

# ⭐ Swagger UI 設定
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

# ⭐ Google Gemini API 設定（從環境變數讀取）
gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest