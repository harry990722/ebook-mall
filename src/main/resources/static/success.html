<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單完成 - 電子書商城</title>
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/chat-widget.css">
    <style>
        /* ⭐ 不再用 body flex 置中，改用一般文流；這樣 navbar / footer 才會在正確位置 */
        body {
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 內容區自己置中 */
        .success-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .success-card {
            max-width: 480px; width: 100%;
            background: white; border-radius: var(--radius-lg);
            padding: 56px 48px; text-align: center;
            box-shadow: var(--shadow-lg);
            animation: fadeUp 0.6s ease;
        }
        .success-ring {
            width: 88px; height: 88px; border-radius: 50%;
            background: linear-gradient(135deg, #d4edda, #a8d5b5);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 0 auto 28px;
            box-shadow: 0 8px 24px rgba(56,161,105,0.25);
        }
        .success-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem; font-weight: 700; margin-bottom: 12px;
        }
        .success-text { color: var(--text-muted); font-size: 0.9rem; line-height: 1.8; margin-bottom: 36px; }
        .success-divider { height: 1px; background: var(--cream-2); margin: 28px 0; }
        .success-links { display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
<div id="navbar"></div>

<div class="success-wrap">
    <div class="success-card">

            訂單細節已發送至您的會員帳號。
        </div>
        <div class="success-divider"></div>
        <div class="success-links">
            <a href="index.html" class="btn btn-primary btn-lg">返回商城首頁</a>
            <a href="orders.html" class="btn btn-outline">查看我的訂單</a>

    </div>
</div>
